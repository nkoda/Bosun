// ---------- worker page, in the order you act on it: where it stands, the conversation, the changes and their comments
function workerPage(w) {
  const si = w.sessionInfo || {}, sid = si.session_id, items = ST.reviews[w.ticket] || [], open = items.filter(i => !i.done);
  const fl = files(w);
  const reviewFile = `${ST.snap.fleet}/scratchpad/reviews/${w.ticket}.md`;
  const changed = new Set(fl.map(f => f.file));
  const cmt = ([it, i]) => `<div class="cmt ${it.done ? 'done' : ''}"><input type="checkbox" ${it.done ? 'checked' : ''} data-act="resolve" data-w="${esc(w.name)}" data-i="${i}" aria-label="${it.done ? 'Reopen' : 'Mark addressed'}" title="${it.done ? 'Reopen' : 'Mark addressed'}">
      <div>${!changed.has(it.file) || it.line ? `<div class="mono muted small"><a data-act="open" data-dir="${esc(w.dir)}" data-file="${esc(it.file)}">${changed.has(it.file) ? 'line ' + it.line : esc(it.file) + (it.line ? ':' + it.line : '')}</a></div>` : ''}
      <div class="text" style="white-space:pre-wrap">${annText(it.text)}</div>
      ${(it.thread || []).map(r => `<div class="reply">${ic(r.who === 'agent' ? 'sparkle' : 'account', 'muted')} ${esc(r.text)}</div>`).join('')}</div></div>`;
  // Drafts sit with the submitted comments, marked, until Submit review.
  const draftRow = ([d, i]) => `<div class="cmt draft"><button class="icon-btn" data-act="draft-remove" data-t="${esc(w.ticket)}" data-i="${i}" title="Delete this draft" aria-label="Delete this draft">${ic('trash')}</button>
      <div>${!changed.has(d.file) || d.line ? `<div class="mono muted small">${changed.has(d.file) ? 'line ' + d.line : esc(d.file) + (d.line ? ':' + d.line : '')}</div>` : ''}
      <div class="text" style="white-space:pre-wrap"><span class="pill pill-draft">Draft</span> ${annText(d.text)}</div></div></div>`;
  const indexed = items.map((it, i) => [it, i]), drafted = (ST.drafts?.[w.ticket] || []).map((d, i) => [d, i]);
  const general = indexed.filter(([it]) => !changed.has(it.file)), generalDrafts = drafted.filter(([d]) => !changed.has(d.file));
  const peekable = !!w.record?.mergeBase;
  const groups = [['committed', 'Committed on branch'], ['uncommitted', 'Uncommitted']].map(([k, t]) => [t, fl.filter(f => f.where === k)]).filter(([, l]) => l.length);
  return `<div class="head"><div class="grow">
      <h1><span class="sw big" style="--c:${color(w.name)}"></span>${esc(titleOf(w))}</h1>
      <div class="sub">${pill(w)}${w.phase?.why ? ` <span class="muted small">${esc(w.phase.why)}</span>` : ''} · ${esc(w.name)}${w.ticket ? ' · ' + ticketLink(w) : ''}</div>
      <div class="sub mono small">${esc(w.branch)} @ ${esc(w.head)} · from ${esc(w.base)} · ${isFinite(w.ahead) ? w.ahead : '?'} ahead, ${w.behind ?? '?'} behind</div>
      ${w.record?.harness ? `<div style="margin-top:12px">${harnessStrip(w.record.harness, 'big')}</div>` : ''}</div>
    <div class="actions">${openBtn(sid, 'Open session', true)}
      ${sid && open.length ? `<button class="btn" data-act="send" data-sid="${esc(sid)}" data-file="${esc(reviewFile)}">${ic('send')} Send ${plural(open.length, 'comment')} to agent</button>` : ''}</div></div>
    ${w.state === 'INTERRUPTED' ? `<div class="callout" style="margin-top:16px">${ic('debug-pause')}<div>The session holding ${esc(w.ticket)} ended with ${plural(w.dirty || 0, 'uncommitted file')}. Nothing here gets collected. Continue that conversation with Open session, or start a new session and run <span class="mono">fleet claim ${esc(w.ticket)}</span>: it adopts this worker, uncommitted work included.</div></div>` : ''}
    ${guideSection(w.record)}
    ${graphSection(w.record)}
    <section><h2>Conversation</h2><div class="card list">
      ${si.lastPrompt ? `<div class="item"><span class="muted">${ic('account')}</span><div class="clamp">${esc(si.lastPrompt)}</div><span class="muted num small">${esc(ago(si.at))}</span></div>` : ''}
      ${si.lastReply ? `<div class="item"><span class="muted">${ic('sparkle')}</span><div class="clamp clamp4">${esc(si.lastReply)}</div><span class="muted small">${w.phase?.key === 'working' ? 'working…' : 'agent'}</span></div>` : ''}
      ${!si.lastPrompt && !si.lastReply ? '<div class="empty">Nothing yet. The conversation shows up after the next prompt in this worker\'s session.</div>' : ''}
      ${sid && w.phase?.key !== 'working' ? `<div style="padding:0 12px 12px">${replyBox(sid, w.name)}</div>` : ''}</div></section>
    ${agentsSection(w)}
    <section><h2>Changes and review <span class="aside">${w.ticket ? reviewControls(w.ticket) + `<button class="btn" data-act="comment" data-w="${esc(w.name)}">${ic('add')} Comment</button>` : ''}
        ${items.length ? `<button class="btn" data-act="open" data-dir="${esc(ST.snap.fleet)}" data-file="scratchpad/reviews/${esc(w.ticket)}.md">${ic('go-to-file')} Review file</button>` : ''}</span></h2>
      <div class="card files">
      ${general.length + generalDrafts.length ? `<div class="group">General comments · ${general.length + generalDrafts.length}</div>${general.map(cmt).join('')}${generalDrafts.map(draftRow).join('')}` : ''}
      ${groups.map(([t, l]) => `<div class="group">${t} · ${l.length}</div>` + l.map(f => {
        const mine = indexed.filter(([it]) => it.file === f.file), myDrafts = drafted.filter(([d]) => d.file === f.file), n = mine.filter(([it]) => !it.done).length, parts = f.file.split('/');
        return `<div class="f" data-act="diff" data-dir="${esc(w.dir)}" data-file="${esc(f.file)}" data-rev="${esc(w.mergeBase)}" ${peekable ? `data-peek="${esc(w.ticket + '|' + f.file + '|')}"` : ''} title="${esc(f.file)} · click for the before / after diff">
          <span class="mono stat-${esc(f.status)}" style="font-weight:600">${esc(f.status[0])}</span>
          <span class="path">${esc(parts.pop())} <span class="dir">${esc(parts.join('/'))}</span></span>
          <span class="num mono"><span class="add">${f.add ? '+' + f.add : ''}</span> <span class="del">${f.del ? '−' + f.del : ''}</span></span>
          ${n ? `<span class="badge" title="Open comments">${n}</span>` : '<span></span>'}
          ${peekable ? `<button class="icon-btn" data-act="peek" data-t="${esc(w.ticket)}" data-file="${esc(f.file)}" title="Preview the diff here" aria-label="Preview the diff of ${esc(f.file)}">${ic('eye')}</button>` : '<span></span>'}
          <button class="icon-btn" data-act="comment" data-w="${esc(w.name)}" data-file="${esc(f.file)}" title="Comment on this file" aria-label="Comment on ${esc(f.file)}">${ic('comment')}</button></div>
          ${mine.length + myDrafts.length ? `<div class="f-cmts">${mine.map(cmt).join('')}${myDrafts.map(draftRow).join('')}</div>` : ''}`;
      }).join('')).join('') || (general.length ? '' : `<div class="empty">No changes beyond the base yet.</div>`)}
      ${fl.length && !items.length ? `<div class="muted small" style="padding:8px 12px">Click a file for the full diff, or ${ic('eye')} to preview it here and press + on a line. Comments stay in your draft until you submit the review.</div>` : ''}</div></section>
    <section><div class="card"><details class="fold" data-k="details:${esc(w.name)}"><summary>${ic('chevron-right')} History, branch and charts</summary><div class="card-b" style="display:grid;gap:12px">
      ${w.record ? `<div class="card"><div class="card-h">Timeline<span class="aside">${esc(w.ticket)}</span></div>${timelineView(w.record.timeline, 6, w.ticket)}</div>` : ''}
      <div class="grid2">
        <div class="card"><div class="card-h">Branch<span class="aside">${esc(w.base)} → ${esc(w.branch)}</span></div><div class="card-b">${mmd(branchGraph(w))}
          <div style="margin-top:8px">${(w.commits || []).slice(0, 8).map(c => `<div class="hbar" style="grid-template-columns:64px 1fr auto" data-tip="${esc(c.subject)}"><span class="mono muted">${esc(c.sha.slice(0, 7))}</span><span class="lbl">${esc(c.subject)}</span><span class="muted num">${esc(c.when)}</span></div>`).join('')}</div></div></div>
        <div class="card"><div class="card-h">Change map<span class="aside">by area · dashed = uncommitted</span></div><div class="card-b">${changeMap(w) ? mmd(changeMap(w)) : '<div class="empty">No changes.</div>'}</div></div>
        <div class="card"><div class="card-h">Churn by file<span class="aside">top 10</span></div><div class="card-b">${churnChart(w)}</div></div></div></div></details></div></section>`;
}

// ---------- render: only repaint what changed, and keep what the person was doing
// (focus, open folds, expanded notes, half-typed replies) across live updates.
let painted = {};
const kept = {}; // data-k → open state or draft text
const focusKey = n => n.tagName + JSON.stringify(n.dataset);
function paint(el, html) {
  if (painted[el.id] === html) return false;
  painted[el.id] = html;
  const f = document.activeElement, fk = el.contains(f) ? focusKey(f) : null, caret = f?.selectionStart;
  el.innerHTML = html;
  for (const n of el.querySelectorAll('[data-k]')) {
    const v = kept[n.dataset.k];
    if (v == null) continue;
    if (n.tagName === 'DETAILS') n.open = v; else if (n.tagName === 'TEXTAREA') n.value = v; else n.classList.toggle('open', v);
  }
  if (fk) {
    const n = [...el.querySelectorAll('button,textarea,input,a,summary')].find(x => focusKey(x) === fk);
    if (n) { n.focus({ preventScroll: true }); if (n.tagName === 'TEXTAREA' && caret != null) n.setSelectionRange(caret, caret); }
  }
  return true;
}
function render() {
  if (!ST || !ST.snap || scrubbing) return;
  paint(document.getElementById('rail'), rail());
  if (CFG.compact) return;
  const content = document.getElementById('content'), main = document.getElementById('main');
  const w = ST.snap.workers.find(x => x.name === sel);
  const top = main.scrollTop;
  const rec = w ? w.record : sel.startsWith('task:') ? recOf(sel.slice(5)) : null;
  if (rec) cgAutoBuild(rec);
  if (!paint(content, w ? workerPage(w) : sel === 'lanes' ? lanesPage() : sel.startsWith('task:') ? ticketPage(sel.slice(5)) : overviewPage())) return;
  for (const el of content.querySelectorAll('.md[data-md]')) {
    const html = window.marked ? marked.parse(decodeURIComponent(el.dataset.md)) : `<pre>${esc(decodeURIComponent(el.dataset.md))}</pre>`;
    el.innerHTML = window.DOMPurify ? DOMPurify.sanitize(html) : esc(decodeURIComponent(el.dataset.md));
    for (const code of el.querySelectorAll('pre code.language-mermaid')) code.parentElement.outerHTML = mmd(code.textContent);
  }
  for (const md of content.querySelectorAll('.md.guide')) { wireGuide(md); decorateGuide(md); markAnnotations(md); }
  applyPeeks(content);
  main.scrollTop = top;
  drawMermaid(content).then(() => { wireDiagrams(content); wireGraph(content); });
}
// Screen readers hear the moments that matter, not every repaint.
function announce(prev, next) {
  if (!prev) return;
  const said = next.snap.workers.filter(w => w.phase?.key !== prev.snap.workers.find(x => x.name === w.name)?.phase?.key && w.phase?.key !== 'working')
    .map(w => `${w.name}, ${titleOf(w)}: ${PHASE[w.phase.key][2]}`);
  if (said.length) document.getElementById('live').textContent = said.join('. ');
}

document.addEventListener('toggle', e => { if (e.target.dataset?.k) kept[e.target.dataset.k] = e.target.open; }, true);
document.addEventListener('input', e => {
  const t = e.target;
  if (t.matches('textarea[data-k]')) kept[t.dataset.k] = t.value;
  if (t.matches('[data-scrub]')) {
    const fr = ST.frames, i = +t.value;
    scrub = i === fr.length - 1 ? null : i;
    document.getElementById('scrub-at').textContent = when(fr[i].at) + (scrub == null ? ' · now' : '');
    document.getElementById('scrub-body').innerHTML = frameView(fr[i]);
  }
  if (t.matches('[data-cg-turn]')) {
    const task = t.dataset.cgTurn, turns = cgOf(task)?.turns;
    if (!turns?.[+t.value]) return; // the graph changed under the held repaint
    (cgView[task] ||= {}).turn = +t.value;
    t.nextElementSibling.innerHTML = cgTurnText(turns, +t.value);
    cgApply(task);
  }
});
// Hold live repaints while a scrubber or the graph's turn slider is dragged, so the handle doesn't jump.
document.addEventListener('pointerdown', e => { if (e.target.matches('[data-scrub], [data-cg-turn]')) scrubbing = true; });
document.addEventListener('pointerup', () => { if (scrubbing) { scrubbing = false; render(); } });
document.addEventListener('change', e => { if (e.target.matches('[data-scrub]')) render(); });

const sess = sid => [...ST.snap.workers.map(x => x.sessionInfo), ...(ST.snap.sessions || [])].find(x => x?.session_id === sid) || { session_id: sid };
document.addEventListener('submit', e => {
  const f = e.target.closest('.reply-box');
  if (!f) return;
  e.preventDefault();
  const t = f.querySelector('textarea'), text = t.value.trim();
  if (!text) return;
  act('resume', { sid: f.dataset.sid, cwd: sess(f.dataset.sid).cwd, prompt: text });
  t.value = ''; delete kept[t.dataset.k];
  toast('Sent to the session');
});

// Popover buttons, the guide's jump bar, and the Annotate button that follows a text selection.
document.getElementById('pop').addEventListener('click', e => { const b = e.target.closest('[data-pop]'); if (b) { e.stopPropagation(); popActions[b.dataset.pop]?.(); } });
document.addEventListener('mousedown', e => { if (!e.target.closest('#pop, #selbtn, .hot, [data-act="line-note"], [data-act="submit-review"]')) closePop(); });
document.addEventListener('mouseup', e => {
  if (e.target.closest('#pop, #selbtn')) return;
  setTimeout(() => {
    const sel = getSelection(), b = document.getElementById('selbtn'), text = sel.toString().trim();
    const at = sel.rangeCount ? sel.anchorNode?.parentElement : null, box = at?.closest('.md.guide, .peek');
    if (!box || text.length < 3 || at.closest('svg')) { b.hidden = true; return; }
    const range = sel.getRangeAt(0).cloneRange(), rect = range.getBoundingClientRect(), target = annotationTarget(at), task = box.dataset.t;
    b.hidden = false; b.innerHTML = `${ic('comment')} Annotate`;
    b.style.left = Math.min(rect.left, innerWidth - 120) + 'px'; b.style.top = Math.min(rect.bottom + 6, innerHeight - 40) + 'px';
    b.onclick = () => { b.hidden = true; annotate(task, { getBoundingClientRect: () => range.getBoundingClientRect() }, text, target); };
  });
});
document.addEventListener('change', e => { if (e.target.matches('[data-switch]')) { act('switch-fleet', { dir: e.target.value }); e.target.value = CFG.fleet; } });
document.addEventListener('selectionchange', () => { if (!getSelection().toString().trim()) document.getElementById('selbtn').hidden = true; });

document.addEventListener('click', async e => {
  const z = e.target.closest('[data-zoom]');
  if (z) { const on = z.nextElementSibling.classList.toggle('zoom'); z.setAttribute('aria-pressed', on); z.innerHTML = `${ic(on ? 'zoom-out' : 'zoom-in')} ${on ? 'Fit' : 'Zoom'}`; return; }
  const j = e.target.closest('[data-jump]');
  if (j) return document.getElementById(j.dataset.jump)?.scrollIntoView({ block: 'start' });
  const x = e.target.closest('.tl-text');
  if (x) { x.classList.toggle('open'); if (x.dataset.k) kept[x.dataset.k] = x.classList.contains('open'); return; }
  const t = e.target.closest('[data-act],[data-sel]');
  if (!t) return;
  const d = t.dataset;
  if (d.act) { if (d.act !== 'resolve') e.preventDefault(); e.stopPropagation(); } else if (CFG.compact) {
    const w = ST.snap.workers.find(x => x.name === d.sel), sid = w?.sessionInfo?.session_id;
    return sid ? act('resume', { sid, cwd: w.sessionInfo.cwd, alt: e.altKey }) : act('dashboard', { sel: d.sel });
  } else return select(d.sel);
  const w = ST.snap.workers.find(x => x.name === d.w);
  switch (d.act) {
    case 'resume': return act('resume', { sid: d.sid, cwd: sess(d.sid).cwd, alt: e.altKey });
    case 'send': return act('resume', { sid: d.sid, cwd: sess(d.sid).cwd, alt: e.altKey, prompt: sendPrompt(d.file) });
    case 'diff': return act('diff', { dir: d.dir, file: d.file, rev: d.rev, right: d.right, line: d.line });
    case 'open': return act('open', { dir: d.dir, file: d.file, line: d.line, rev: d.rev });
    case 'peek': return togglePeek(d.t, d.file, d.line || '');
    case 'line-note': return annotate(d.t, t, t.closest('tr').querySelector('.code').textContent.trim() || `line ${d.line}`, { file: d.file, line: +d.line });
    case 'submit-review': return submitReview(d.t, t);
    case 'draft-remove': return post('/api/draft-remove', { ticket: d.t, index: +d.i });
    case 'url': return act('url', { url: d.url });
    case 'dashboard': return act('dashboard', { sel: d.to || 'overview' });
    case 'browser': return act('url', { url: `http://127.0.0.1:${ST.port}/` });
    case 'live': scrub = null; return render();
    case 'guide': return post('/api/guide', { ticket: d.t, kind: d.kind });
    case 'guide-kind': guideKind[d.t] = d.kind; return render();
    case 'export': return exportGuide(d.t, d.kind, d.to).catch(err => toast('Export failed: ' + err.message));
    case 'resolve': return post('/api/resolve', { worker: d.w, index: +d.i, done: t.checked });
    case 'comment': return comment(w, d.file);
    case 'cg-build': return act('graph', { task: d.t, force: true });
    case 'cg-chain': { const v = (cgView[d.t] ||= {}); v.chain = v.chain === +d.i ? null : +d.i; return cgApply(d.t); }
    case 'cg-node': return cgSelect(d.t, d.id, t);
    case 'cg-zoom': { const s = cgSec(d.t)?.querySelector('.mmd svg'), b = s?.getBoundingClientRect(); return b && s.cgZoom?.(+d.k, b.left + b.width / 2, b.top + b.height / 2); }
    case 'cg-fit': return cgSec(d.t)?.querySelector('.mmd svg')?.cgFit?.();
  }
});
document.addEventListener('keydown', e => {
  if (e.target.closest?.('section.cg') && cgKey(e)) return; // the graph's own j / k / Escape
  if (e.key === 'Escape' && !pop().hidden) return closePop();
  if (e.key === 'Enter' && (e.metaKey || e.ctrlKey) && e.target.closest('#pop')) { e.preventDefault(); return (popActions.add || popActions.submit)?.(); }
  if (e.key === 'Enter' && (e.metaKey || e.ctrlKey) && e.target.closest('.reply-box')) { e.preventDefault(); return e.target.closest('.reply-box').requestSubmit(); }
  // j / k step through the pages, like a mail list.
  if (CFG.compact || !ST || e.metaKey || e.ctrlKey || e.altKey || e.target.closest('input,textarea,select,dialog')) return;
  if (e.key !== 'j' && e.key !== 'k') return;
  const order = ['overview', 'lanes', ...ST.snap.workers.map(w => w.name)], i = order.indexOf(sel);
  select(order[(Math.max(i, 0) + (e.key === 'j' ? 1 : order.length - 1)) % order.length]);
  document.querySelector('.row.sel .row-main')?.focus();
});

function comment(w, file) {
  const dlg = document.getElementById('dlg');
  document.getElementById('dlg-title').textContent = `Comment on ${w.ticket}`;
  document.getElementById('dlg-file').textContent = file || 'General comment on the change';
  document.getElementById('dlg-text').value = '';
  dlg.onclose = () => {
    const text = document.getElementById('dlg-text').value.trim();
    if (dlg.returnValue === 'ok' && text) { post('/api/draft', { worker: w.name, file: file || '(general)', line: null, text, author: CFG.author }); toast('Added to your draft review'); }
  };
  dlg.showModal(); document.getElementById('dlg-text').focus();
}
document.getElementById('dlg-text').addEventListener('keydown', e => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); document.getElementById('dlg').close('ok'); } });

// tooltip
const tip = document.getElementById('tip');
document.addEventListener('mousemove', e => {
  const t = e.target.closest('[data-tip]');
  if (!t) { tip.style.display = 'none'; return; }
  tip.textContent = t.dataset.tip; tip.style.display = 'block';
  tip.style.left = Math.min(e.clientX + 12, innerWidth - tip.offsetWidth - 8) + 'px'; tip.style.top = (e.clientY + 14) + 'px';
});

// theme changes inside VS Code repaint the diagrams
new MutationObserver(() => { setupMermaid(); painted = {}; render(); }).observe(document.body, { attributes: true, attributeFilter: ['class'] });
setupMermaid();

// live state
window.addEventListener('message', e => {
  if (e.data?.type === 'select') select(e.data.sel);
  if (e.data?.type === 'cg-busy') { e.data.on ? cgBusy.add(e.data.task) : cgBusy.delete(e.data.task); if (ST) render(); }
});
function connect() {
  const es = new EventSource(`${CFG.server}/events?token=${encodeURIComponent(CFG.token)}`);
  const conn = document.getElementById('conn');
  es.onmessage = ev => { conn.style.display = 'none'; const s = JSON.parse(ev.data); if (s.snap) { announce(ST, s); ST = s; render(); } };
  es.onerror = () => { conn.innerHTML = `${ic('loading', 'codicon-modifier-spin')} Reconnecting to the fleet server…`; conn.style.display = 'block'; };
}
connect();
</script>
